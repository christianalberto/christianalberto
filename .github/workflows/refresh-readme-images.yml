name: Refresh README image cache

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-readme-image-cache
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh image URL versions
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          version = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")

          def refresh_insight_url(match: re.Match[str]) -> str:
              url = re.sub(r"[&_](?:v|_t)=[^&\" )]+", "", match.group(0))
              return f"{url}&v={version}"

          text = re.sub(
              r"https://github-profiles-insights\.vercel\.app/api/insight\?[^\" )]+",
              refresh_insight_url,
              text,
          )
          text = re.sub(
              r"(\.?/profile/profile-gitblock\.svg)(?:\?v=[^\" )]+)?",
              lambda match: f"{match.group(1)}?v={version}",
              text,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit updated image URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "No image URLs needed refreshing."
            exit 0
          fi

          git commit -m "Refresh README image cache"
          git push
