name: Update 3D Contributions

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: christianalberto-profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Alberto 3D contribution graph
        run: |
          mkdir -p profile
          curl --fail --location --retry 3 \
            "https://github-profiles-insights.vercel.app/api/contrib-3d?username=christianalberto&style=alberto&animate=true&_t=$(date -u +%s)" \
            -o profile/profile-night-view.svg

          # Fail early if the API returned an error SVG instead of a real graph
          if ! grep -q '<svg' profile/profile-night-view.svg; then
            echo "Downloaded file is not a valid SVG"
            exit 1
          fi
          if grep -qiE 'GITHUB_TOKEN is not configured|User .+ not found|Failed to generate' profile/profile-night-view.svg; then
            echo "API returned an error SVG:"
            head -c 500 profile/profile-night-view.svg
            exit 1
          fi

      - name: Refresh README cache buster
        run: |
          VERSION=$(date -u +%Y%m%d%H%M%S)
          sed -i -E "s|(\./profile/profile-night-view\\.svg)(\\?v=[^\"' )]+)?|\1?v=${VERSION}|g" README.md

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/profile-night-view.svg
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update 3D contribution graph"
          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done

          echo "Could not push after 3 attempts."
          exit 1
