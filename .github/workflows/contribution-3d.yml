name: Update 3D Contributions

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: christianalberto-profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Tokyo Night contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.STREAK_STATS_TOKEN }}
          USERNAME: christianalberto
          SETTING_JSON: ./profile-3d-settings.json

      - name: Match 3D language chart palette
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg_file = Path("profile-3d-contrib/profile-gitblock.svg")
          svg = svg_file.read_text(encoding="utf-8")

          palette = {
              "#f1e05a": "#38BDAE",
              "#e34c26": "#70A5FD",
              "#fbbf24": "#BF91F3",
              "#ff6b35": "#70A5FD",
              "#663399": "#BF91F3",
              "#083fa1": "#70A5FD",
              "#3572a5": "#38BDAE",
              "#aa6746": "#A9AFD0",
          }

          for source, target in palette.items():
              svg = re.sub(source, target, svg, flags=re.IGNORECASE)

          svg_file.write_text(svg, encoding="utf-8")
          PY

      - name: Move generated graph into profile
        run: |
          mkdir -p profile
          mv profile-3d-contrib/profile-gitblock.svg profile/profile-gitblock.svg
          rm -rf profile-3d-contrib

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s|(profile/profile-gitblock\\.svg)(\\?v=[0-9]+)?|\\1?v=${{ github.run_number }}|g" README.md
          git add profile/profile-gitblock.svg
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update 3D contribution graph"
          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done

          echo "Could not push after 3 attempts."
          exit 1
