name: Update GitHub Cards

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: christianalberto-profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Sharp
        run: npm install --no-save --package-lock=false sharp

      - name: Download Aurora Night insights
        run: |
          curl --fail --location --retry 3 \
            "https://github-profiles-insights.vercel.app/api/insight?username=christianalberto&theme=aurora_night&graph=true&languages=true&streak=true&stats=true&header=true&summary=true&profile=false&cache=false" \
            -o insights.svg

      - name: Create GitHub cards image
        run: |
          node <<'EOF'
          const sharp = require("sharp");

          async function main() {
            const insightsImage = await sharp("insights.svg", { density: 300 })
              .png({ compressionLevel: 9 })
              .toBuffer();

            await sharp(insightsImage)
              .png({ compressionLevel: 9 })
              .toFile("profile/github-cards.png");

            const metadata = await sharp("profile/github-cards.png").metadata();
            console.log(`Created profile/github-cards.png: ${metadata.width}x${metadata.height}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s|(profile/github-cards\\.png)(\\?v=[0-9]+)?|\\1?v=${{ github.run_number }}|g" README.md
          git add profile/github-cards.png
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile cards"
          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done

          echo "Could not push after 3 attempts."
          exit 1
