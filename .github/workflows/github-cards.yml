name: Update GitHub Cards

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: christianalberto-profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Sharp
        run: npm install --no-save --package-lock=false sharp

      - name: Download Tokyo Night insights
        run: |
          curl --fail --location --retry 3 \
            "https://github-profiles-insights.vercel.app/api/insight?username=christianalberto&theme=tokyonight&graph=true&languages=true&streak=true&stats=true&header=true&summary=true&profile=false" \
            -o insights.svg

      - name: Match streak palette
        run: |
          node <<'EOF'
          const fs = require("fs");
          let svg = fs.readFileSync("insights.svg", "utf8");

          // Keep the cards and streak visually consistent.
          const palette = {
            "#1a1b26": "#1A1B27",
            "#bb9af7": "#BF91F3",
            "#9ece6a": "#70A5FD",
            "#565f89": "#70A5FD",
            "#ff6b35": "#70A5FD",
            "#a9b1d6": "#70A5FD",
            "#9ca3af": "#70A5FD",
            "#34d399": "#38BDAE",
            "#a78bfa": "#BF91F3",
            "#f472b6": "#BF91F3",
            "#60a5fa": "#70A5FD",
            "#fbbf24": "#BF91F3",
            "#e34c26": "#70A5FD",
            "#f1e05a": "#38BDAE",
            "#663399": "#BF91F3",
            "#083fa1": "#70A5FD",
            "#3572a5": "#38BDAE",
            "#aa6746": "#A9AFD0"
          };

          for (const [source, target] of Object.entries(palette)) {
            svg = svg.replace(new RegExp(source, "gi"), target);
          }

          fs.writeFileSync("insights.svg", svg);
          EOF

      - name: Create GitHub cards image
        run: |
          node <<'EOF'
          const sharp = require("sharp");

          async function main() {
            const insightsImage = await sharp("insights.svg", { density: 300 })
              .png({ compressionLevel: 9 })
              .toBuffer();

            await sharp(insightsImage)
              .png({ compressionLevel: 9 })
              .toFile("profile/github-cards.png");

            const metadata = await sharp("profile/github-cards.png").metadata();
            console.log(`Created profile/github-cards.png: ${metadata.width}x${metadata.height}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s|(profile/github-cards\\.png)(\\?v=[0-9]+)?|\\1?v=${{ github.run_number }}|g" README.md
          git add profile/github-cards.png
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile cards"
          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done

          echo "Could not push after 3 attempts."
          exit 1
