name: Update streak stats

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  push:
    branches: ["main"]
  workflow_dispatch: # Run manually from the Actions tab

concurrency:
  group: christianalberto-profile-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # GitHub profile README: Tokyo Night
      - name: Generate streak (README)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=christianalberto&theme=tokyonight&hide_border=true&border_radius=12&disable_animations=true&locale=en
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Portfolio web: amber / transparent void
      - name: Generate streak (web)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=christianalberto&hide_border=true&border_radius=12&disable_animations=true&locale=en&background=00000000&stroke=232544&ring=FF9E5E&fire=FF7A45&currStreakNum=ECEEFB&sideNums=ECEEFB&currStreakLabel=FF9E5E&sideLabels=A9AFD0&dates=6F76A0
          path: profile/streak-web.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Bust GitHub Camo cache on the profile README (cache=false was demolab-only)
      - name: Refresh README cache buster
        run: |
          sed -i -E "s|(profile/streak\\.svg)(\\?v=[0-9]+)?|\\1?v=${{ github.run_number }}|g" README.md

      - name: Commit streak stats
        run: |
          git config user.name "christianalberto"
          git config user.email "51129408+christianalberto@users.noreply.github.com"
          mkdir -p profile
          git add profile/streak.svg profile/streak-web.svg README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update streak stats"
          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done

          echo "Could not push after 3 attempts."
          exit 1
